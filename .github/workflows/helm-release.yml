name: Helm Chart Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update chart dependencies
        run: |
          # Sync extra plugin lua files into the fuseone chart before packaging
          cp custom-plugins/apisix/plugins/api-composition.lua charts/fuseone/files/plugins/
          cp custom-plugins/apisix/plugins/fuseone-timing.lua  charts/fuseone/files/plugins/
          cp custom-plugins/apisix/plugins/opentelemetry.lua   charts/fuseone/files/plugins/
          cd charts/fuseone
          helm dependency update

      - name: Package charts
        run: |
          mkdir -p .helm-packages
          helm package charts/fuseone  -d .helm-packages
          helm package charts/apisix   -d .helm-packages
          helm package charts/etcd     -d .helm-packages

      - name: Upload chart to release
        uses: softprops/action-gh-release@v2
        with:
          files: .helm-packages/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
