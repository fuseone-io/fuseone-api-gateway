<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs>
    <linearGradient id="gw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5fb8"/>
      <stop offset="100%" stop-color="#950fb8"/>
    </linearGradient>
  </defs>
  <!-- Rounded shield base -->
  <path d="M22,1 L41,9 L41,24 C41,35 33,41 22,44 C11,41 3,35 3,24 L3,9 Z" fill="url(#gw)"/>
  <!-- API flow arrows: three converging paths into a central node -->
  <!-- Left arrow path -->
  <path d="M10,14 L18,20" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Center arrow path (straight down) -->
  <path d="M22,10 L22,20" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Right arrow path -->
  <path d="M34,14 L26,20" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Central gateway node (diamond/hub) -->
  <rect x="17" y="18" width="10" height="10" rx="2.5" fill="white" opacity="0.95" transform="rotate(45 22 23)"/>
  <!-- Outgoing path from hub -->
  <path d="M22,30 L22,38" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Arrowhead at bottom -->
  <path d="M18.5,35 L22,39 L25.5,35" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
