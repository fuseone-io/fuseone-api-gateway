apiVersion: v2
name: fuseone
description: FuseOne API Gateway Platform - Complete deployment solution
type: application
version: 1.0.0
appVersion: "1.0.0"
icon: https://fuseone.io/icon.png

keywords:
  - api-gateway
  - apisix
  - management
  - clickhouse
  - analytics

home: https://github.com/devopsfuseone/fuseone-api-gateway

maintainers:
  - name: devopsfuseone
    url: https://github.com/devopsfuseone

dependencies:
  - name: apisix
    version: "2.13.0"
    repository: "file://../apisix"
    condition: apisix.enabled
    tags:
      - gateway
  - name: etcd
    version: "0.1.0"
    repository: "file://../etcd"
    condition: etcd.enabled
    tags:
      - gateway
