# =============================================================================
# Production Values — Full Platform
# Apply on top of values.yaml:
#   helm upgrade --install fuseone ./charts/fuseone \
#     -f charts/fuseone/values.yaml \
#     -f charts/fuseone/values-production.yaml \
#     --set backend.secrets.dbPassword=CHANGEME \
#     --set backend.secrets.jwtSecret=CHANGEME \
#     --set backend.secrets.apisixApiKey=CHANGEME \
#     --set clickhouse.auth.password=CHANGEME
# =============================================================================

# =============================================================================
# Backend
# =============================================================================
backend:
  replicas: 3

  image:
    pullPolicy: Always

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  config:
    dbSSLMode: "require"
    corsOrigins: "https://console.fuseone.example.com"
    debugEnabled: "false"

  secrets:
    dbPassword: ""      # --set backend.secrets.dbPassword=CHANGEME
    jwtSecret: ""       # --set backend.secrets.jwtSecret=CHANGEME
    apisixApiKey: ""    # --set backend.secrets.apisixApiKey=CHANGEME

  ingress:
    enabled: true
    className: nginx
    host: api.fuseone.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    tls:
      - secretName: api-fuseone-tls
        hosts:
          - api.fuseone.example.com

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: backend
            topologyKey: kubernetes.io/hostname

# =============================================================================
# Frontend
# =============================================================================
frontend:
  replicas: 3

  image:
    pullPolicy: Always

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ingress:
    enabled: true
    className: nginx
    host: console.fuseone.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - secretName: console-fuseone-tls
        hosts:
          - console.fuseone.example.com

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: frontend
            topologyKey: kubernetes.io/hostname

# =============================================================================
# PostgreSQL
# =============================================================================
postgresql:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi

  persistence:
    size: 50Gi

# =============================================================================
# etcd (local sub-chart — quay.io/coreos/etcd)
# 3 replicas spread across nodes: survives loss of 1 member.
# =============================================================================
etcd:
  replicaCount: 3

  image:
    tag: v3.5.21    # always pin for stateful components — never use "latest"

  storage:
    size: 20Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: etcd
          topologyKey: kubernetes.io/hostname

# =============================================================================
# APISIX
# externalEtcd.host must match release-name-etcd (default: fuseone-etcd).
# Override if using a different release name:
#   --set apisix.externalEtcd.host[0]=http://MYRELEASE-etcd:2379
# =============================================================================
apisix:
  externalEtcd:
    host:
      - http://fuseone-etcd:2379

  apisix:
    replicaCount: 3

    image:
      pullPolicy: Always

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

    admin:
      credentials:
        admin: ""   # --set apisix.apisix.admin.credentials.admin=CHANGEME
      # Restrict Admin API to internal CIDR in production:
      # allow:
      #   ipList:
      #     - 10.0.0.0/8

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: apisix
            topologyKey: kubernetes.io/hostname

  service:
    type: LoadBalancer
    annotations: {}
    # AWS NLB example:
    #   service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # GCP example:
    #   cloud.google.com/load-balancer-type: External

# =============================================================================
# Event Gateway
# =============================================================================
eventGateway:
  enabled: true

  image:
    pullPolicy: Always

  replicas: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: event-gateway
            topologyKey: kubernetes.io/hostname

# =============================================================================
# ClickHouse (Analytics)
# =============================================================================
clickhouse:
  enabled: true

  keeper:
    replicas: 3
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi

  cluster:
    shards: 2
    replicas: 2
    storage:
      size: 100Gi
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 4
        memory: 8Gi

  auth:
    password: ""    # --set clickhouse.auth.password=CHANGEME
