# =============================================================================
# FuseOne API Gateway Platform - Helm Values
# =============================================================================
# Deployment modes:
#   1. Full Platform  : all enabled (default)
#   2. Gateway Only   : backend/frontend/postgresql disabled, apisix+etcd enabled
#   3. Console Only   : apisix+etcd disabled, point backend to remote gateway(s)
# =============================================================================

global:
  imageRegistry: ""
  imagePullSecrets: []
  #  - name: my-registry-secret

nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Backend API (Go)
# =============================================================================
backend:
  enabled: true

  image:
    repository: devopsfuseone/fuseone-api-gateway-backend
    tag: "latest"
    pullPolicy: IfNotPresent

  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: api.fuseone.local
    tls: []
    #  - secretName: api-tls
    #    hosts:
    #      - api.fuseone.local

  config:
    serverPort: "8080"
    dbName: "fuseone_gateway"
    dbSSLMode: "disable"
    jwtExpiryMinutes: "60"
    refreshExpiryDays: "30"
    corsOrigins: ""
    debugEnabled: "false"
    debugRetentionHours: "48"
    debugMaxRows: "50000"
    # Override when apisix.enabled=false (console-only mode)
    apisixAdminURL: ""
    apisixControlURL: ""

  secrets:
    dbUser: "gateway"
    dbPassword: "gateway"
    jwtSecret: ""          # auto-generated if empty
    apisixApiKey: "fuseone-gateway-admin-key"

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# Frontend Dashboard (Next.js)
# =============================================================================
frontend:
  enabled: true

  image:
    repository: devopsfuseone/fuseone-api-gateway-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  replicas: 2

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 3000
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: console.fuseone.local
    tls: []

  env:
    apiURL: ""    # auto-detected when backend.enabled=true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# PostgreSQL
# =============================================================================
postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  external:
    host: ""
    port: "5432"

  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Event Gateway (Go) - Kafka & NATS protocol mediator
# =============================================================================
eventGateway:
  enabled: false

  image:
    repository: devopsfuseone/fuseone-event-gateway
    tag: "latest"
    pullPolicy: IfNotPresent

  replicas: 2

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 8090
    annotations: {}

  config:
    serverPort: "8090"
    dbName: ""
    dbSSLMode: ""

  secrets:
    dbUser: ""
    dbPassword: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# etcd — distributed key-value store for APISIX
#
# Uses the local charts/etcd chart (quay.io/coreos/etcd — NOT Bitnami).
# The etcd Service name follows Helm standard convention:
#   <release-name>-etcd  (e.g. "fuseone-etcd" when release = "fuseone")
#
# APISIX externalEtcd.host below must match this service.
# If you install with a custom release name, override:
#   --set apisix.externalEtcd.host[0]=http://MYRELEASE-etcd:2379
# =============================================================================
etcd:
  enabled: true

  replicaCount: 3

  image:
    repository: quay.io/coreos/etcd
    tag: v3.5.21
    pullPolicy: IfNotPresent

  storage:
    size: 25Gi
    storageClassName: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  affinity: {}
  tolerations: []
  nodeSelector: {}

# =============================================================================
# Apache APISIX (sub-chart: charts/fuseone/charts/apisix-2.13.0.tgz)
#
# The Bitnami etcd bundled inside the APISIX chart is DISABLED.
# We use the independent etcd sub-chart above instead.
# =============================================================================
apisix:
  enabled: true

  # Disable the Bitnami etcd that ships inside the apisix chart
  etcd:
    enabled: false

  # Connect APISIX to our etcd service
  # Default: release name "fuseone" → service "fuseone-etcd"
  externalEtcd:
    host:
      - http://fuseone-etcd:2379
    user: ""
    password: ""

  apisix:
    image:
      repository: devopsfuseone/apisix
      tag: "latest"
      pullPolicy: IfNotPresent

    admin:
      enabled: true
      credentials:
        admin: "fuseone-gateway-admin-key"
      allow:
        ipList:
          - 0.0.0.0/0

    # Complete plugin list — mirrors apisix-config.yaml.
    # FuseOne custom plugins are baked into devopsfuseone/apisix image.
    plugins:
      - real-ip
      - client-control
      - proxy-control
      - request-id
      - zipkin
      - ext-plugin-pre-req
      - fault-injection
      - mocking
      - serverless-pre-function
      - cors
      - ip-restriction
      - ua-restriction
      - referer-restriction
      - csrf
      - uri-blocker
      - request-validation
      - multi-auth
      - openid-connect
      - authz-keycloak
      - authz-casdoor
      - wolf-rbac
      - ldap-auth
      - hmac-auth
      - basic-auth
      - jwt-auth
      - key-auth
      - consumer-restriction
      - forward-auth
      - opa
      - authz-casbin
      - cas-auth
      - limit-conn
      - limit-count
      - limit-req
      - gzip
      - server-info
      - traffic-split
      - redirect
      - response-rewrite
      - grpc-transcode
      - grpc-web
      - public-api
      - prometheus
      - datadog
      - elasticsearch-logger
      - echo
      - loggly
      - http-logger
      - skywalking-logger
      - google-cloud-logging
      - sls-logger
      - tcp-logger
      - kafka-logger
      - rocketmq-logger
      - syslog
      - udp-logger
      - file-logger
      - clickhouse-logger
      - tencent-cloud-cls
      - inspect
      - example-plugin
      - api-breaker
      - proxy-mirror
      - proxy-cache
      - proxy-rewrite
      - workflow
      - opentelemetry
      - body-transformer
      - ext-plugin-post-req
      - ext-plugin-post-resp
      - serverless-post-function
      - degraphql
      - graphql-depth-limit
      - graphql-complexity
      - graphql-allowlist
      - graphql-introspection-guard
      # FuseOne custom plugins (baked into devopsfuseone/apisix image)
      - http-callout
      - data-masking
      - threat-protection
      - api-composition
      - fuseone-timing

    pluginAttrs:
      prometheus:
        export_addr:
          ip: "0.0.0.0"
          port: 9091
      opentelemetry:
        resource:
          service.name: "fuseone-gateway"
        batch_span_processor:
          max_export_batch_size: 64
          inactive_timeout: 2
        trace_id_source: x-request-id
        set_ngx_var: true
        collector:
          # Assumes release "fuseone"; update if using a different release name
          address: "fuseone-backend:8080"
          request_timeout: 3
          request_headers:
            Content-Type: application/x-protobuf

    customPlugins:
      enabled: false

  service:
    type: NodePort

# =============================================================================
# ClickHouse (Analytics) - Optional
# =============================================================================
clickhouse:
  enabled: false

  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"

  keeper:
    enabled: true
    replicas: 3
    image:
      repository: clickhouse/clickhouse-keeper
      tag: "24.8"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""

  cluster:
    name: fuseone
    shards: 2
    replicas: 2
    storage:
      size: 50Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi

  auth:
    username: fuseone
    password: ""
    database: fuseone_analytics

  settings:
    maxConnections: 4096
    maxConcurrentQueries: 100
    maxMemoryUsage: "10000000000"

# =============================================================================
# Database Migrations
# =============================================================================
migrations:
  enabled: true
  backoffLimit: 3
