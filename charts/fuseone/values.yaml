# =============================================================================
# FuseOne API Gateway Platform - Helm Values
# =============================================================================
# Deployment modes:
#   1. Full Platform  : all enabled (default)
#   2. Gateway Only   : backend/frontend/postgresql disabled, apisix enabled
#   3. Console Only   : apisix disabled, point backend to remote gateway(s)
# =============================================================================

global:
  imageRegistry: ""
  imagePullSecrets: []
  #  - name: my-registry-secret

nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Backend API (Go)
# =============================================================================
backend:
  enabled: true

  image:
    repository: klinux/fuseone-api-gateway-backend
    tag: "latest"
    pullPolicy: IfNotPresent

  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: api.fuseone.local
    tls: []
    #  - secretName: api-tls
    #    hosts:
    #      - api.fuseone.local

  # Application config (mapped to env vars)
  config:
    serverPort: "8080"
    dbName: "fuseone_gateway"
    dbSSLMode: "disable"
    jwtExpiryMinutes: "60"
    refreshExpiryDays: "30"
    corsOrigins: ""
    debugEnabled: "false"
    debugRetentionHours: "48"
    debugMaxRows: "50000"
    # Override these if apisix.enabled=false (console-only mode)
    apisixAdminURL: ""
    apisixControlURL: ""

  # Secrets
  secrets:
    dbUser: "gateway"
    dbPassword: "gateway"
    jwtSecret: ""          # auto-generated if empty
    apisixApiKey: "fuseone-gateway-admin-key"

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra environment variables
  extraEnv: []
  #  - name: CUSTOM_VAR
  #    value: "custom-value"

# =============================================================================
# Frontend Dashboard (Next.js)
# =============================================================================
frontend:
  enabled: true

  image:
    repository: klinux/fuseone-api-gateway-frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  replicas: 2

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 3000
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: console.fuseone.local
    tls: []
    #  - secretName: console-tls
    #    hosts:
    #      - console.fuseone.local

  env:
    # Backend API URL (auto-detected if backend.enabled)
    apiURL: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# PostgreSQL
# =============================================================================
postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Used when postgresql.enabled=false
  external:
    host: ""
    port: "5432"

  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Apache APISIX (sub-chart)
# =============================================================================
apisix:
  enabled: true

  # Values passed to the APISIX sub-chart
  # See charts/apisix/values.yaml for full reference
  apisix:
    image:
      repository: apache/apisix
      tag: 3.15.0-debian
    admin:
      enabled: true
      credentials:
        admin: "fuseone-gateway-admin-key"
    customPlugins:
      enabled: true
      plugins:
        - name: http-callout
          configMap:
            name: ""  # auto-created
            mounts:
              - key: http-callout.lua
                path: /opt/apisix/plugins/http-callout.lua
        - name: data-masking
          configMap:
            name: ""
            mounts:
              - key: data-masking.lua
                path: /opt/apisix/plugins/data-masking.lua
        - name: threat-protection
          configMap:
            name: ""
            mounts:
              - key: threat-protection.lua
                path: /opt/apisix/plugins/threat-protection.lua

  service:
    type: NodePort

  etcd:
    enabled: true
    replicaCount: 3

# =============================================================================
# ClickHouse (Analytics) - Optional
# =============================================================================
clickhouse:
  enabled: false  # opt-in: set to true to deploy ClickHouse

  # ClickHouse Operator must be installed first
  # Run: scripts/install-clickhouse-operator.sh
  # Or: kubectl apply -f https://raw.githubusercontent.com/Altinity/clickhouse-operator/master/deploy/operator/clickhouse-operator-install-bundle.yaml

  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"

  # ---------- ClickHouse Keeper (replaces ZooKeeper) ----------
  keeper:
    enabled: true
    replicas: 3

    image:
      repository: clickhouse/clickhouse-keeper
      tag: "24.8"

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi

    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""

  # ---------- ClickHouse Cluster ----------
  cluster:
    name: fuseone
    shards: 2
    replicas: 2

    storage:
      size: 50Gi
      storageClass: ""

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi

  # ---------- Auth ----------
  auth:
    username: fuseone
    password: ""  # auto-generated if empty
    database: fuseone_analytics

  # ---------- Settings ----------
  settings:
    maxConnections: 4096
    maxConcurrentQueries: 100
    maxMemoryUsage: "10000000000"

# =============================================================================
# Database Migrations
# =============================================================================
migrations:
  enabled: true
  # Uses the backend image with migration command
  backoffLimit: 3
