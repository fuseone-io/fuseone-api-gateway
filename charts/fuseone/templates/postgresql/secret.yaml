{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuseone.fullname" . }}-postgresql
  labels:
    {{- include "fuseone.postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.backend.secrets.dbUser | quote }}
  password: {{ .Values.backend.secrets.dbPassword | quote }}
{{- end }}
