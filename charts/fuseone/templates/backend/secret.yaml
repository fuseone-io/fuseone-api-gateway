{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuseone.fullname" . }}-backend
  labels:
    {{- include "fuseone.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.backend.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.backend.secrets.dbPassword | quote }}
  JWT_SECRET: {{ include "fuseone.jwtSecret" . | quote }}
  APISIX_API_KEY: {{ .Values.backend.secrets.apisixApiKey | quote }}
{{- end }}
