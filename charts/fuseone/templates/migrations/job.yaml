{{- if and .Values.backend.enabled .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fuseone.fullname" . }}-migrations-{{ .Release.Revision }}
  labels:
    {{- include "fuseone.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "fuseone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "fuseone.postgresql.host" . }} {{ include "fuseone.postgresql.port" . }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.global.imageRegistry }}{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          command: ["/gateway-api"]
          args: ["--migrate-only"]
          env:
            - name: DB_HOST
              value: {{ include "fuseone.postgresql.host" . | quote }}
            - name: DB_PORT
              value: {{ include "fuseone.postgresql.port" . | quote }}
            - name: DB_NAME
              value: {{ .Values.backend.config.dbName | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.backend.config.dbSSLMode | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuseone.fullname" . }}-backend
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuseone.fullname" . }}-backend
                  key: DB_PASSWORD
{{- end }}
