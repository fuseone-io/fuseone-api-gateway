{{- if .Values.eventGateway.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuseone.fullname" . }}-event-gateway
  labels:
    {{- include "fuseone.eventGateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.eventGateway.secrets.dbUser | default .Values.backend.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.eventGateway.secrets.dbPassword | default .Values.backend.secrets.dbPassword | quote }}
{{- end }}
