{{- if .Values.eventGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuseone.fullname" . }}-event-gateway
  labels:
    {{- include "fuseone.eventGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.eventGateway.replicas }}
  selector:
    matchLabels:
      {{- include "fuseone.eventGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuseone.eventGateway.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/event-gateway/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/event-gateway/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: event-gateway
          image: "{{ .Values.global.imageRegistry }}{{ .Values.eventGateway.image.repository }}:{{ .Values.eventGateway.image.tag }}"
          imagePullPolicy: {{ .Values.eventGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.eventGateway.config.serverPort | default 8090 }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "fuseone.fullname" . }}-event-gateway
            - secretRef:
                name: {{ include "fuseone.fullname" . }}-event-gateway
          {{- with .Values.eventGateway.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.eventGateway.resources | nindent 12 }}
      {{- with .Values.eventGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
