{{- if .Values.apisix.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuseone-extra-plugins
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fuseone.labels" . | nindent 4 }}
    app.kubernetes.io/component: apisix
data:
  api-composition.lua: |
    {{ .Files.Get "files/plugins/api-composition.lua" | nindent 4 }}
  fuseone-timing.lua: |
    {{ .Files.Get "files/plugins/fuseone-timing.lua" | nindent 4 }}
  opentelemetry.lua: |
    {{ .Files.Get "files/plugins/opentelemetry.lua" | nindent 4 }}
{{- end }}
