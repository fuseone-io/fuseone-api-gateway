services:
  etcd:
    image: bitnamilegacy/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  apisix:
    image: apache/apisix:3.15.0-debian
    depends_on:
      etcd:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9080:9080"
      - "9090:9090"
      - "9091:9091"
      - "9180:9180"
      - "9443:9443"
    volumes:
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./custom-plugins:/opt/custom-plugins:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuseone_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d fuseone_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Kafka (optional, start with: docker compose --profile kafka up) ---

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    profiles: [kafka]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    profiles: [kafka]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-bridge:
    image: quay.io/strimzi/kafka-bridge:0.29.0
    profiles: [kafka]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"
    command:
      - /opt/strimzi/bin/kafka_bridge_run.sh
      - --config-file=/opt/strimzi/config/application.properties
    environment:
      KAFKA_BRIDGE_ID: bridge-01
    volumes:
      - ./kafka-bridge.properties:/opt/strimzi/config/application.properties:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  etcd_data:
  pg_data:
  zk_data:
  kafka_data:
