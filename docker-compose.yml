services:
  etcd:
    image: bitnamilegacy/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  apisix:
    image: apache/apisix:3.15.0-debian
    depends_on:
      etcd:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9080:9080"
      - "9090:9090"
      - "9091:9091"
      - "9180:9180"
      - "9443:9443"
    volumes:
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./custom-plugins:/opt/custom-plugins:ro
      - ./custom-plugins/apisix/plugins/opentelemetry.lua:/usr/local/apisix/apisix/plugins/opentelemetry.lua:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuseone_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d fuseone_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Kafka (optional, start with: docker compose --profile kafka up) ---

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    profiles: [kafka]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    profiles: [kafka]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  event-gateway:
    build: ./event-gateway
    profiles: [kafka, nats]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fuseone_gateway
      DB_USER: gateway
      DB_PASSWORD: gateway
      DB_SSLMODE: disable
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- NATS (optional, start with: docker compose --profile nats up) ---

  nats:
    image: nats:2.10-alpine
    profiles: [nats]
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    command: >
      --jetstream
      --store_dir /data
      --http_port 8222
      --max_payload 1048576
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ClickHouse (optional, start with: docker compose --profile clickhouse up) ---

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [clickhouse]
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native TCP
    environment:
      CLICKHOUSE_DB: fuseone_analytics
      CLICKHOUSE_USER: fuseone
      CLICKHOUSE_PASSWORD: fuseone
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # --- Elasticsearch (optional, start with: docker compose --profile elasticsearch up) ---

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: [elasticsearch]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Prometheus (optional, start with: docker compose --profile prometheus up) ---

  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: [prometheus]
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  etcd_data:
  pg_data:
  zk_data:
  kafka_data:
  nats_data:
  clickhouse_data:
  clickhouse_logs:
  es_data:
  prometheus_data:
