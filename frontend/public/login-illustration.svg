<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5fb8"/>
      <stop offset="100%" stop-color="#950fb8"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5fb8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#950fb8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f5fb8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#950fb8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="800"/><line x1="50" y1="0" x2="50" y2="800"/>
    <line x1="100" y1="0" x2="100" y2="800"/><line x1="150" y1="0" x2="150" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/><line x1="250" y1="0" x2="250" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/><line x1="350" y1="0" x2="350" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/><line x1="450" y1="0" x2="450" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/><line x1="550" y1="0" x2="550" y2="800"/>
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/><line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/><line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="450" x2="600" y2="450"/><line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="550" x2="600" y2="550"/><line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="0" y1="650" x2="600" y2="650"/><line x1="0" y1="700" x2="600" y2="700"/>
    <line x1="0" y1="750" x2="600" y2="750"/>
  </g>

  <!-- Glow circles -->
  <circle cx="300" cy="350" r="200" fill="url(#glow1)" opacity="0.5"/>
  <circle cx="150" cy="250" r="100" fill="#0f5fb8" opacity="0.06"/>
  <circle cx="450" cy="500" r="120" fill="#950fb8" opacity="0.06"/>

  <!-- === API Flow Visualization === -->

  <!-- Top: Three client nodes -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="white" opacity="0.08" stroke="white" stroke-opacity="0.15"/>
    <text x="50" y="25" text-anchor="middle" fill="white" opacity="0.6" font-family="Inter, sans-serif" font-size="12" font-weight="500">Client A</text>
  </g>
  <g transform="translate(250, 140)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="white" opacity="0.08" stroke="white" stroke-opacity="0.15"/>
    <text x="50" y="25" text-anchor="middle" fill="white" opacity="0.6" font-family="Inter, sans-serif" font-size="12" font-weight="500">Client B</text>
  </g>
  <g transform="translate(400, 180)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="white" opacity="0.08" stroke="white" stroke-opacity="0.15"/>
    <text x="50" y="25" text-anchor="middle" fill="white" opacity="0.6" font-family="Inter, sans-serif" font-size="12" font-weight="500">Client C</text>
  </g>

  <!-- Flow lines from clients to gateway -->
  <path d="M150,220 L300,310" stroke="url(#line1)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M300,180 L300,310" stroke="url(#line1)" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
  <path d="M450,220 L300,310" stroke="url(#line1)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Animated dots on flow lines (static representation) -->
  <circle cx="220" cy="262" r="3" fill="#4d9fff" opacity="0.8"/>
  <circle cx="300" cy="250" r="3" fill="#4d9fff" opacity="0.9"/>
  <circle cx="380" cy="262" r="3" fill="#4d9fff" opacity="0.8"/>

  <!-- Central Gateway Hub -->
  <g transform="translate(300, 360)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#gw)" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#gw)" stroke-width="1.5" opacity="0.2"/>
    <!-- Inner filled circle -->
    <circle cx="0" cy="0" r="45" fill="url(#gw)" opacity="0.9"/>
    <!-- Shield icon inside -->
    <path d="M0,-22 L20,-14 L20,-2 C20,8 12,14 0,18 C-12,14 -20,8 -20,-2 L-20,-14 Z" fill="white" opacity="0.2"/>
    <path d="M0,-18 L16,-11 L16,-2 C16,6 10,11 0,15 C-10,11 -16,6 -16,-2 L-16,-11 Z" fill="white" opacity="0.15"/>
    <!-- Converging arrows inside shield -->
    <path d="M-8,-8 L0,0" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <path d="M0,-14 L0,0" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <path d="M8,-8 L0,0" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <!-- Central diamond -->
    <rect x="-4" y="-2" width="8" height="8" rx="1.5" fill="white" opacity="0.95" transform="rotate(45 0 2)"/>
    <!-- Down arrow -->
    <path d="M0,8 L0,16" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    <path d="M-3,14 L0,17 L3,14" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- Gateway label -->
  <text x="300" y="435" text-anchor="middle" fill="white" opacity="0.9" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="2">API GATEWAY</text>

  <!-- Policy badges -->
  <g transform="translate(130, 455)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#0f5fb8" opacity="0.25" stroke="#0f5fb8" stroke-opacity="0.4"/>
    <text x="40" y="17" text-anchor="middle" fill="#6d9ad8" font-family="Inter, sans-serif" font-size="9" font-weight="600">AUTH</text>
  </g>
  <g transform="translate(220, 455)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#dc2626" opacity="0.15" stroke="#dc2626" stroke-opacity="0.3"/>
    <text x="40" y="17" text-anchor="middle" fill="#f87171" font-family="Inter, sans-serif" font-size="9" font-weight="600">SECURITY</text>
  </g>
  <g transform="translate(310, 455)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-opacity="0.3"/>
    <text x="40" y="17" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="9" font-weight="600">TRAFFIC</text>
  </g>
  <g transform="translate(400, 455)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-opacity="0.3"/>
    <text x="40" y="17" text-anchor="middle" fill="#a78bfa" font-family="Inter, sans-serif" font-size="9" font-weight="600">TRANSFORM</text>
  </g>

  <!-- Flow lines from gateway to upstreams -->
  <path d="M300,490 L150,560" stroke="url(#line1)" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <path d="M300,490 L300,560" stroke="url(#line1)" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
  <path d="M300,490 L450,560" stroke="url(#line1)" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Downstream dots -->
  <circle cx="220" cy="528" r="3" fill="#a855f7" opacity="0.7"/>
  <circle cx="300" cy="525" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="380" cy="528" r="3" fill="#a855f7" opacity="0.7"/>

  <!-- Bottom: Three upstream nodes -->
  <g transform="translate(80, 565)">
    <rect x="0" y="0" width="130" height="50" rx="10" fill="white" opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <circle cx="22" cy="25" r="10" fill="#22c55e" opacity="0.3"/>
    <circle cx="22" cy="25" r="4" fill="#22c55e" opacity="0.7"/>
    <text x="72" y="21" text-anchor="middle" fill="white" opacity="0.7" font-family="Inter, sans-serif" font-size="10" font-weight="500">api-users</text>
    <text x="72" y="36" text-anchor="middle" fill="white" opacity="0.35" font-family="Inter, monospace" font-size="9">:8080</text>
  </g>
  <g transform="translate(235, 565)">
    <rect x="0" y="0" width="130" height="50" rx="10" fill="white" opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <circle cx="22" cy="25" r="10" fill="#22c55e" opacity="0.3"/>
    <circle cx="22" cy="25" r="4" fill="#22c55e" opacity="0.7"/>
    <text x="72" y="21" text-anchor="middle" fill="white" opacity="0.7" font-family="Inter, sans-serif" font-size="10" font-weight="500">api-orders</text>
    <text x="72" y="36" text-anchor="middle" fill="white" opacity="0.35" font-family="Inter, monospace" font-size="9">:3000</text>
  </g>
  <g transform="translate(390, 565)">
    <rect x="0" y="0" width="130" height="50" rx="10" fill="white" opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <circle cx="22" cy="25" r="10" fill="#f59e0b" opacity="0.3"/>
    <circle cx="22" cy="25" r="4" fill="#f59e0b" opacity="0.7"/>
    <text x="72" y="21" text-anchor="middle" fill="white" opacity="0.7" font-family="Inter, sans-serif" font-size="10" font-weight="500">api-payments</text>
    <text x="72" y="36" text-anchor="middle" fill="white" opacity="0.35" font-family="Inter, monospace" font-size="9">:9090</text>
  </g>

  <!-- Bottom branding -->
  <text x="300" y="700" text-anchor="middle" fill="white" opacity="0.15" font-family="Inter, sans-serif" font-size="11" font-weight="500" letter-spacing="4">POWERED BY APACHE APISIX</text>
</svg>
