image:
  repository: apache/apisix
  pullPolicy: IfNotPresent

replicaCount: 1
priorityClassName: ""
podAnnotations: {}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

hostNetwork: false
nodeSelector: {}
#tolerations:
#  - effect: NoSchedule
#    key: fuseone
#    operator: Equal
#    value: gateway

# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#         - matchExpressions:
#             - key: cloud.google.com/gke-nodepool
#               operator: In
#               values:
#                 - pool-prod
#                 - pool-spot

topologySpreadConstraints: []

timezone: "America/Sao_Paulo"

extraEnvVars: []

updateStrategy: {}
  # type: RollingUpdate

extraDeploy: []
extraVolumes: []
extraVolumeMounts: []

autoscaling:
  enabled: true
  version: v2
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

service:
  externalTrafficPolicy: Local
  type: LoadBalancer
  annotations: {}
  externalIPs: []
  http:
    enabled: true
    servicePort: 80
    containerPort: 9080
    additionalContainerPorts: []
  tls:
    servicePort: 443

  stream:
    enabled: false
    tcp: []
    udp: []

ingress:
  enabled: false

control:
  enabled: true
  service:
    type: ClusterIP
    ip: "0.0.0.0"
    port: 9090
    servicePort: 9090
  ingress:
    enabled: false

apisix:
  enableIPv6: false
  enableHTTP2: true
  enableServerTokens: false
  setIDFromPodUID: false
  luaModuleHook:
    enabled: false
    luaPath: ""
    hookPoint: ""
    configMapRef:
      name: ""
      mounts:
        - key: ""
          path: ""

  ssl:
    enabled: true

  router:
    http: radixtree_host_uri

  fullCustomConfig:
    enabled: false
    config: {}

  deployment:
    # API-driven standalone: sem etcd, config em memoria via Admin API
    # https://apisix.apache.org/docs/apisix/deployment-modes/
    mode: traditional
    role: "traditional"
    role_traditional:
      config_provider: "etcd"

  admin:
    enabled: true
    enable_admin_ui: false
    type: ClusterIP
    externalIPs: []
    ip: 0.0.0.0
    port: 9180
    servicePort: 9180
    cors: true
    credentials:
      admin: ohvaedohvae3jo0So3Hooj2raichiqua
      viewer: OoNgeiCheCh7AicahY4ye3aushah8ohu
      secretName: ""
      secretAdminKey: ""
      secretViewerKey: ""

    allow:
      ipList:
        - 0.0.0.0/0

    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        kubernetes.io/tls-acme: "true"
        ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: "apisix-admin.fuseone.io"
          paths:
            - /
      tls:
        - secretName: "apisix-admin-fuseone-io"
          hosts:
            - "apisix-admin.fuseone.io"
  nginx:
    workerRlimitNofile: "20480"
    workerConnections: "10620"
    workerProcesses: 2
    enableCPUAffinity: true
    keepaliveTimeout: 30s
    envs: []
    logs:
      enableAccessLog: true
      accessLog: "/dev/stdout"
      accessLogFormat: '{"ts":"$time_iso8601","remote":"$remote_addr","real_ip":"$http_x_forwarded_for","host":"$http_host","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ref":"$http_referer","ua":"$http_user_agent","proto":"$http_x_forwarded_proto","cid":"$http_x_correlation_id","upstream":"$upstream_addr","us":$upstream_status,"urt":$upstream_response_time,"scheme":"$scheme","ssl":"$ssl_protocol"}\n'
      accessLogFormatEscape: json
      errorLog: "/dev/stderr"
      errorLogLevel: "debug"
    configurationSnippet:
      main: |

      httpStart: |

      httpEnd: |

      httpSrv: |

      httpAdmin: |

      stream: |

    customLuaSharedDicts: []
      # - name: foo
      #   size: 10k
      # - name: bar
      #   size: 1m

    luaSharedDicts: []
      # - name: prometheus-metrics
      #   size: 20m

  discovery:
    enabled: true
    registry:
      kubernetes:
        service:
          # apiserver schema, options [http, https]
          schema: https #default https
          # apiserver host, options [ipv4, ipv6, domain, environment variable]
          host: ${KUBERNETES_SERVICE_HOST} #default ${KUBERNETES_SERVICE_HOST}
          # apiserver port, options [port number, environment variable]
          port: ${KUBERNETES_SERVICE_PORT}  #default ${KUBERNETES_SERVICE_PORT}
        client:
          # serviceaccount token or token_file
          token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        default_weight: 50 # weight assigned to each discovered endpoint. default 50, minimum 0

  vault:
    enabled: false
    host: ""
    timeout: 10
    token: ""
    prefix: ""

  prometheus:
    enabled: false
    path: /apisix/prometheus/metrics
    metricPrefix: apisix_
    containerPort: 9091

  plugins: []
  stream_plugins: []
  pluginAttrs:
    redirect:
      https_port: 443

  extPlugin:
    enabled: false
    cmd: ["/path/to/apisix-plugin-runner/runner", "run"]

  wasm:
    enabled: false
    plugins: []

  customPlugins:
    enabled: false

  status:
    ip: "0.0.0.0"
    port: 7085

etcd:
  enabled: false

externalEtcd:
  host:
    - http://etcd:2379
  user: ""
  password: ""
  existingSecret: ""
  secretPasswordKey: ""

ingress-controller:
  enabled: true
  autoscaling:
    enabled: false
  deployment:
    annotations: {}
    podAnnotations: {}
    replicas: 1
    nodeSelector: {}
    tolerations: []
      # - effect: NoSchedule
      #   key: fuseone
      #   operator: Equal
      #   value: gateway
  config:
    provider:
      type: apisix
  apisix:
    adminService:
      namespace: apisix
      name: apisix-admin
      port: 9180
  gatewayProxy:
    createDefault: true
    plugins:
      - name: cors
        enabled: true
        config:
          allow_credential: false
          allow_headers: "*"
          allow_methods: "GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD"
          allow_origins_by_regex:
            - ".*\\.fuseone\\.io$"
            - "localhost\\:3000"
          expose_headers: "*"
          max_age: 86400
      - name: redirect
        enabled: true
        config:
          http_to_https: true
      - name: request-id
        enabled: true
        config:
          header_name: "X-Correlation-Id"
          include_in_response: true
          algorithm: "uuid"
    provider:
      type: ControlPlane
      controlPlane:
        endpoints: []
        service:
          name: ""
          port: 9180
        auth:
          type: AdminKey
          adminKey:
            value: "ohvaedohvae3jo0So3Hooj2raichiqua"
            valueFrom: {}
