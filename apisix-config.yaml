apisix:
  node_listen: 9080
  enable_admin: true
  enable_admin_cors: true
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9090

deployment:
  admin:
    admin_key:
      - name: admin
        key: fuseone-gateway-admin-key
        role: admin
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    https_admin: false
    allow_admin:
      - 0.0.0.0/0

  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
